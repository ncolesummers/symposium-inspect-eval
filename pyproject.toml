[project]
name = "inspect-evals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nate Summers", email = "nsummers@uidaho.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.1.0",
    "inspect-ai>=0.3.278",
    "openai>=3.28.0",
]

[project.scripts]
inspect-evals = "inspect_evals:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
    "ty>=0.0.91",
]
